# Path: pubspec.yaml
# ============================================================
# MT5 Clone — Production Flutter Application
# Architecture: Clean Architecture + DDD + Riverpod
# ============================================================

name: mt5_clone
description: >
  A production-grade MetaTrader 5 Android clone with integrated
  Local Expert Advisor (EA) execution engine powered by Chaquopy.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

# ============================================================
# DEPENDENCIES — Only actively imported packages
# ============================================================
dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Domain Layer ---
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4

  # --- Networking ---
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # --- Local Persistence ---
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # --- Serialization ---
  json_annotation: ^4.9.0

  # --- Logging ---
  logger: ^2.3.0

  # --- UI ---
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  overlay_support: ^2.1.0
  go_router: ^13.2.0
  intl: ^0.19.0

  # --- Security ---
  flutter_secure_storage: ^9.0.0

  # --- Utilities ---
  uuid: ^4.4.0
  rxdart: ^0.28.0

# ============================================================
# DEV DEPENDENCIES — Code Generation & Testing
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generators ---
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.28.0

  # --- Linting ---
  flutter_lints: ^4.0.0

  # --- Testing ---
  mocktail: ^1.0.4
  fake_async: ^1.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/sounds/

  fonts:
    # Primary UI Font — Orbitron (trading terminal feel)
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 900

    # Secondary Font — JetBrains Mono (data & numbers)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic

    # Tertiary Font — Inter (general UI text)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
