// Path: android/app/build.gradle
// ============================================================
// MT5 Clone — App-Level Gradle Build Configuration
// Based on Flutter 3.41.9 canonical template
// ============================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Chaquopy MUST be applied after the android plugin
apply plugin: "com.chaquo.python"

android {
    namespace "com.mt5clone.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.mt5clone.app"
        minSdk 26
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // Chaquopy Python runtime
        python {
            version "3.11"
            // Pip packages will be added when EA engine is implemented.
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            manifestPlaceholders["chaquopyDebuggable"] = "true"
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "String", "OANDA_BASE_URL", '"https://api-fxpractice.oanda.com"'
            buildConfigField "String", "OANDA_STREAM_URL", '"https://stream-fxpractice.oanda.com"'
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            manifestPlaceholders["chaquopyDebuggable"] = "false"
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "String", "OANDA_BASE_URL", '"https://api-fxtrade.oanda.com"'
            buildConfigField "String", "OANDA_STREAM_URL", '"https://stream-fxtrade.oanda.com"'
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        excludes += [
            "META-INF/LICENSE",
            "META-INF/LICENSE.txt",
            "META-INF/NOTICE",
            "META-INF/NOTICE.txt",
            "META-INF/ASL2.0",
            "META-INF/*.kotlin_module"
        ]
        pickFirsts += [
            "lib/arm64-v8a/libsqlite3x.so",
            "lib/armeabi-v7a/libsqlite3x.so",
            "lib/x86_64/libsqlite3x.so"
        ]
    }

    lint {
        disable "InvalidPackage"
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Core Android
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.multidex:multidex:2.0.1"

    // Desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.2"
    implementation "androidx.lifecycle:lifecycle-service:2.8.2"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // JSON
    implementation "com.google.code.gson:gson:2.11.0"

    // Encrypted storage
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}

flutter {
    source "../.."
}
