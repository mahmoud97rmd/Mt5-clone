# Path: android/gradle.properties
# ============================================================
# MT5 Clone — Gradle Properties
# Performance tuning, AndroidX migration, Kotlin options
# ============================================================

# --------------------------------------------------------
# 1.2.4.1 — JVM Memory Configuration
# Increased heap for Chaquopy Python packaging + Flutter build
# --------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m \
  -XX:MaxMetaspaceSize=1024m \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8 \
  -XX:+UseParallelGC

# --------------------------------------------------------
# 1.2.4.2 — Gradle Performance Flags
# --------------------------------------------------------
# Enable Gradle daemon for faster incremental builds
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Configuration cache disabled — incompatible with Kotlin 1.9.22 + AGP 8.2.2
org.gradle.configuration-cache=false

# Enable build cache (re-use outputs from previous builds)
org.gradle.caching=true

# --------------------------------------------------------
# 1.2.4.3 — AndroidX Migration
# Mandatory for modern Android development
# --------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=true

# --------------------------------------------------------
# 1.2.4.4 — Kotlin Compiler Options
# --------------------------------------------------------
kotlin.code.style=official

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Enable KAPT incremental annotation processing (for Hilt, Room)
kapt.incremental.apt=true

# Use new Kotlin K2 compiler (experimental — comment out if build issues)
# kotlin.experimental.tryK2=true

# --------------------------------------------------------
# 1.2.4.5 — Android Build Flags
# --------------------------------------------------------
# Non-transitive R classes (faster builds, avoids resource conflicts)
android.nonTransitiveRClass=true

# Enable R8 full mode for better code shrinking in release
android.enableR8.fullMode=false

# Suppress specific deprecation warnings
android.suppressUnsupportedOptionWarnings=android.enableJetifier

# --------------------------------------------------------
# 1.2.4.6 — Flutter Build Flags
# --------------------------------------------------------
# Use the new "rbe" remote build execution (if available in CI)
# flutter.buildMode=debug

# Shrink engine binaries for smaller APK
flutter.targetPlatform=android-arm,android-arm64,android-x64

# --------------------------------------------------------
# 1.2.4.7 — Chaquopy Flags
# --------------------------------------------------------
# Allow Chaquopy to use Gradle configuration cache
# (Chaquopy 16+ is configuration-cache compatible)
chaquopy.configurationCache=true
