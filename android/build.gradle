// Path: android/build.gradle
// ============================================================
// MT5 Clone — Project-Level Gradle Build Configuration
// Based on Flutter 3.41.9 canonical template
// ============================================================

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect build output to project root (where Flutter expects the APK)
rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
