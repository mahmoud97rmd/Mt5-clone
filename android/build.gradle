// Based on Flutter 3.41.9 canonical template
// ============================================================

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Chaquopy uses apply plugin: syntax, so AGP + Chaquopy must be on buildscript classpath
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "com.chaquo.python:gradle:15.0.1"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
