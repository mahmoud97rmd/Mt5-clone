# Path: .github/workflows/build.yml
# ============================================================
# MT5 Clone — GitHub Actions CI/CD
# Builds debug and release APK on Ubuntu x86_64
# ============================================================

name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # Manual trigger

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.4'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # 2. Java 17 (required by AGP 8.x)
      # ──────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ──────────────────────────────────────────────
      # 3. Flutter SDK
      # ──────────────────────────────────────────────
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ──────────────────────────────────────────────
      # 4. Android SDK components (NDK, build-tools)
      # ──────────────────────────────────────────────
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "build-tools;36.0.0" \
            "platforms;android-36" 2>&1 | tail -5

      # ──────────────────────────────────────────────
      # 5. Python 3.11 for Chaquopy
      #    Chaquopy's buildPython must be 3.8–3.12;
      #    Ubuntu's default Python 3.12+ breaks pip's
      #    cgi module. Install 3.11 explicitly.
      # ──────────────────────────────────────────────
      - name: Set up Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python for Chaquopy
        run: |
          python3 --version
          python3 -c "import cgi; print('cgi module OK')"

      # ──────────────────────────────────────────────
      # 6. Flutter dependencies
      # ──────────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ──────────────────────────────────────────────
      # 7. Code generation (Drift, Freezed, Riverpod)
      # ──────────────────────────────────────────────
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ──────────────────────────────────────────────
      # 8. Static analysis
      # ──────────────────────────────────────────────
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      # ──────────────────────────────────────────────
      # 9. Build debug APK
      # ──────────────────────────────────────────────
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --android-skip-build-dependency-validation

      # ──────────────────────────────────────────────
      # 10. Build release APK
      # ──────────────────────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation

      # ──────────────────────────────────────────────
      # 11. Upload artifacts
      # ──────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mt5-clone-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mt5-clone-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ──────────────────────────────────────────────────
  # Optional: run tests
  # ──────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --no-pub
        continue-on-error: true    # Remove once tests are written
