# Path: .github/workflows/build.yml
# ============================================================
# MT5 Clone — GitHub Actions CI/CD
# Builds debug and release APK on Ubuntu x86_64
# ============================================================

name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "build-tools;36.0.0" \
            "platforms;android-36" 2>&1 | tail -5

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK (with Gradle stacktrace)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -100

      - name: Check APK output
        if: always()
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" 2>/dev/null
          echo "=== build/app/outputs ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Not found at build/app/outputs"
          echo "=== android/build/app/outputs ==="
          ls -la android/build/app/outputs/flutter-apk/ 2>/dev/null || echo "Not found at android/build/app/outputs"

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mt5-clone-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mt5-clone-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
